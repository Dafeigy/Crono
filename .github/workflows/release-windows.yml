name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer and portable executable
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows bundles
        run: npm run desktop:build

      - name: Collect release files
        shell: pwsh
        run: |
          $releaseDir = "dist/release"
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $nsis = Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe" |
            Select-Object -First 1
          $msi = Get-ChildItem "target/release/bundle/msi" -Filter "*.msi" |
            Select-Object -First 1

          Copy-Item "target/release/crono-app.exe" "$releaseDir/Crono_${tag}_windows_x64_portable.exe"
          Copy-Item $nsis.FullName "$releaseDir/Crono_${tag}_windows_x64_setup.exe"
          Copy-Item $msi.FullName "$releaseDir/Crono_${tag}_windows_x64_en-US.msi"

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Crono-${{ github.ref_name }}-windows
          path: dist/release/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem "dist/release" -File |
            Select-Object -ExpandProperty FullName

          gh release create "${{ github.ref_name }}" $assets `
            --verify-tag `
            --title "Crono ${{ github.ref_name }}" `
            --generate-notes
